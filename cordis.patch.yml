# dsh-plugin-subagent-director bundle patch.
#
# Adds the main entry, the Web settings bridge, and a headless-safe Blue entry.
# The Blue entry waits in a child Fiber when bluePluginHost is absent, so Web
# and headless profiles keep their existing activation path.
# Install: dsh plugin --profile <name> add dsh-plugin-subagent-director
# Restart `dsh --profile <name>` after installing.
- insert:
    - id: subagent-director
      name: dsh-plugin-subagent-director
- insert:
    - id: subagent-director-bridge
      name: dsh-plugin-subagent-director/bridge
- insert:
    - id: subagent-director-blue
      name: dsh-plugin-subagent-director/blue
